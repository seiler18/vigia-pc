# Con un tag vX.Y.Z: compila Vigia.exe autónomo (no requiere .NET instalado,
# ≈ 69 MB) y crea la release con ese archivo. Ver skill publicar-version.
name: Publicar versión

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Compilar
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dotnet publish src/Vigia -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$($env:TAG.TrimStart('v')) -o publicado

      - name: Crear release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG publicado/Vigia.exe --repo ${{ github.repository }} --title "Vigía $env:TAG" --generate-notes
