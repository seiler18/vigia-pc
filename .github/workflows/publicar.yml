# Con un tag vX.Y.Z: compila Vigia.exe autónomo (no requiere .NET instalado,
# ≈ 69 MB) y crea la release con ese archivo. Ver skill publicar-version.
#
# El .exe no va firmado (un certificado de firma de código cuesta dinero cada
# año). Para que igual se pueda comprobar de dónde salió, la release lleva:
#  - Vigia.exe.sha256: el hash, para ver que el archivo no cambió en el camino;
#  - una atestación de procedencia de GitHub: prueba firmada de que ese .exe
#    lo compiló este workflow desde este repo y este commit. Se verifica con
#    `gh attestation verify Vigia.exe -R seiler18/vigia-pc`.
#
# Son dos jobs a propósito: el que compila ejecuta código de las dependencias
# y no tiene permiso de escritura; el que publica no ejecuta nada del repo.
name: Publicar versión

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write      # firmar la atestación (identidad OIDC del workflow)
      attestations: write  # guardarla en el repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar con las versiones fijadas
        run: dotnet restore src/Vigia --locked-mode

      - name: Compilar
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dotnet publish src/Vigia -c Release -r win-x64 --self-contained true --no-restore `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$($env:TAG.TrimStart('v')) -o publicado
          $hash = (Get-FileHash publicado/Vigia.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Vigia.exe" | Out-File publicado/Vigia.exe.sha256 -Encoding ascii -NoNewline

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publicado/Vigia.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vigia
          path: publicado/
          retention-days: 1

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vigia
          path: publicado

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" publicado/Vigia.exe publicado/Vigia.exe.sha256 --repo "$REPO" --title "Vigía $TAG" --generate-notes
