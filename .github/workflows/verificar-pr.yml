# Compila cada PR (el de Dependabot incluido) para saber si rompe algo ANTES de
# fusionarlo. En Windows porque WPF no compila en Linux.
name: Verificar PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construir:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Vigia.slnx --locked-mode
      - run: dotnet build Vigia.slnx -c Release --no-restore
